name: Publish to npm

# Publishes the `fablecut` package whenever a GitHub release goes out. Auth is
# npm Trusted Publishing (OIDC): npm trusts this workflow file directly, so there
# is no NPM_TOKEN secret to store or rotate. One-time setup on npmjs.com:
# package `fablecut` → Settings → Trusted Publisher → GitHub Actions,
# repo ronak-create/FableCut, workflow `publish-npm.yml`.

on:
  release:
    types: [published]
  workflow_dispatch:        # manual re-run: publishes whatever main's package.json says

permissions:
  contents: read
  id-token: write           # required for the OIDC exchange with npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm >= 11.5.1. Pinned, not @latest: this job can publish.
      - name: Update npm
        run: npm install -g npm@11.21.1

      - name: Check the version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "package.json version: $version"
          # A release tag must match package.json, or we'd publish the wrong version.
          if [ -n "${TAG:-}" ] && [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
          # Already published (e.g. by hand)? Nothing to do — npm refuses re-publishes.
          if npm view "fablecut@$version" version >/dev/null 2>&1; then
            echo "fablecut@$version is already on npm, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the test suite
        if: steps.ver.outputs.skip != 'true'
        run: npm test

      - name: Publish
        if: steps.ver.outputs.skip != 'true'
        run: npm publish --access public

  # Lists the release in the official MCP Registry from server.json. Runs after
  # npm because the registry checks the npm package's mcpName. Auth is GitHub
  # OIDC, which owns the io.github.ronak-create/* namespace — no token to store.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the registry
        id: reg
        run: |
          set -euo pipefail
          version=$(node -p "require('./server.json').version")
          # Already listed (re-run)? The registry refuses duplicate versions.
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=fablecut&version=$version" | grep -q "\"version\":\"$version\""; then
            echo "Version $version is already in the MCP Registry, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.reg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Pinned release + checksum, not releases/latest: this job holds publish rights.
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
